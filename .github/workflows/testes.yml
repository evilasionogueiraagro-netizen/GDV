name: Testes automáticos
# Roda tests/run.js (Code.gs real no fakegas + app/painel no Chromium) em 4 partes ao mesmo tempo, cada uma numa
# máquina com seu fakegas nas portas padrão ("node run.js --parte N/4", divididas pelo tempo de cada teste no PESO
# do run.js). A suíte em fila leva ~11 min; em 4 partes, ~4 min. O workflow só fica verde com as 4 partes verdes
# (a publicação do Apps Script espera isso).
# Roda uma vez por mudança: no PR para a main (testa o resultado do merge) e no push da main. Branch sem PR:
# Actions → Testes automáticos → Run workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  testes:
    name: testes (parte ${{ matrix.parte }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false                     # uma parte com falha não interrompe as outras: o resumo mostra tudo de uma vez
      matrix:
        parte: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: tests
    env:
      GDV_PORTA_WEB: 8081
      GDV_PORTA_API: 8082
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium do Playwright (mesma versão do playwright-core)
        run: npx playwright-core install --with-deps chromium
      - name: Instalar pypdf e python-docx (conferem os PDFs e os .docx gerados, ex. tf_paginas e convenio_test)
        run: python3 -m pip install --user --break-system-packages pypdf python-docx
      - name: Rodar testes
        run: node run.js --parte ${{ matrix.parte }}/4 --tentativas 2
      - name: Publicar saída (screenshots, PDFs, logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: saida-testes-parte-${{ matrix.parte }}
          path: tests/saida/
          retention-days: 14
