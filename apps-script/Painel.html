<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDV – Painel do administrador</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* Paleta de referência (validada): slot 1 azul, slot 2 laranja; sequencial = azul claro→escuro. */
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grade:#e1e0d9; --eixo:#c3c2b7; --borda:rgba(11,11,11,.10); --wash:rgba(11,11,11,.05);
    --s1:#2a78d6; --s2:#eb6834; --s1-hover:#5598e7;
    --seq1:#cde2fb; --seq2:#86b6ef; --seq3:#3987e5; --seq4:#1c5cab; --seq5:#0d366b;
    --bom:#006300; --ruim:#b02a2a; --aviso:#8a5a00; --vazio:#efeeea;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
      --grade:#2c2c2a; --eixo:#383835; --borda:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
      --s1:#3987e5; --s2:#d95926; --s1-hover:#6da7ec;
      --seq1:#0d366b; --seq2:#1c5cab; --seq3:#3987e5; --seq4:#86b6ef; --seq5:#cde2fb;
      --bom:#0ca30c; --ruim:#ec7a7a; --aviso:#fab219; --vazio:#242423;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:16px 16px 4px; max-width:1240px; margin:0 auto; display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; }
  header small { color:var(--ink2); }
  main, #filtros { max-width:1240px; margin:0 auto; padding:0 16px; }
  #filtros { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; padding-top:12px; padding-bottom:12px; position:sticky; top:0; background:var(--page); z-index:20; border-bottom:1px solid var(--grade); }
  .grupo { display:flex; gap:4px; flex-wrap:wrap; }
  label { display:flex; flex-direction:column; font-size:12px; color:var(--ink2); gap:3px; }
  input, select, button { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--borda); border-radius:8px; padding:7px 9px; }
  button { cursor:pointer; } button:hover { background:var(--wash); }
  button[aria-pressed="true"], .seg button.on { border-color:var(--s1); font-weight:700; box-shadow:inset 0 0 0 1px var(--s1); }
  .seg { display:inline-flex; gap:4px; flex-wrap:wrap; max-width:100%; }
  .cab > div:last-child { display:flex; gap:6px; flex-wrap:wrap; max-width:100%; }
  .seg button { white-space:nowrap; }
  .seg button { padding:5px 9px; font-size:13px; }
  .primario { background:var(--s1); color:#fff; border-color:var(--s1); } .primario:hover { background:var(--s1-hover); }
  #conteudo { transition:opacity .15s; padding-top:14px; padding-bottom:40px; }
  #conteudo.carregando { opacity:.55; }
  .grade { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); margin-bottom:12px; }
  .cards { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); margin-bottom:12px; }
  @media (max-width:520px) { .cards { grid-template-columns:1fr; } }
  .card { background:var(--surface); border:1px solid var(--borda); border-radius:12px; padding:14px; min-width:0; }
  .card h2 { font-size:15px; margin:0; } .card .sub { color:var(--ink2); font-size:12px; margin:2px 0 10px; }
  .cab { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; flex-wrap:wrap; }
  .tile .l { color:var(--ink2); font-size:12px; } .tile .v { font-size:26px; font-weight:650; margin-top:2px; }
  .tile .d { font-size:12px; color:var(--ink2); margin-top:2px; }
  .hero { grid-column:span 2; } .hero .v { font-size:52px; line-height:1.05; font-weight:700; }
  @media (max-width:520px) { .hero { grid-column:span 1; } }
  .graf { position:relative; height:280px; } .graf.alto { height:340px; }
  .twin { overflow:auto; max-height:320px; display:none; } .card.verTabela .twin { display:block; } .card.verTabela .graf { display:none; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--grade); white-space:nowrap; }
  th { color:var(--ink2); font-weight:600; position:sticky; top:0; background:var(--surface); }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .rolar { overflow:auto; max-height:360px; }
  .heat { display:grid; gap:2px; grid-template-columns:34px repeat(24, minmax(18px,1fr)); min-width:560px; }
  .heat div { height:30px; border-radius:3px; font-size:11px; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .heat .c:hover, .heat .c:focus { outline:2px solid var(--ink); outline-offset:1px; }
  .legenda { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink2); margin-bottom:6px; }
  .legenda i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px; }
  .escala { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink2); margin-top:8px; }
  .escala span.rampa { width:120px; height:8px; border-radius:4px; background:linear-gradient(90deg,var(--seq1),var(--seq3),var(--seq5)); }
  #mapa { height:340px; border-radius:8px; z-index:1; }
  .alerta { display:flex; gap:8px; padding:8px 10px; border-radius:8px; background:var(--wash); margin-bottom:6px; }
  .alerta b { white-space:nowrap; }
  .vazio { color:var(--ink2); padding:14px 0; }
  #tip { position:fixed; pointer-events:none; background:var(--surface); border:1px solid var(--borda); border-radius:8px; padding:6px 9px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.18); display:none; z-index:50; max-width:260px; }
  #tip strong { font-size:14px; display:block; }
  .login { max-width:420px; margin:28px auto; } .login p { color:var(--ink2); }
  .login input { width:100%; font-size:22px; letter-spacing:4px; text-align:center; margin:10px 0; }
  .login button { width:100%; }
  #sair[hidden] { display:none; }
  #erro { display:none; margin:16px; padding:12px; border-radius:8px; background:var(--wash); }
  .btn-dl { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
</style>
</head>
<body>
<header><h1>GDV · Painel do administrador</h1><span><small id="quem"></small> <small id="atualizado"></small> <button id="sair" type="button" hidden>Sair</button></span></header>
<section id="login" class="card login" style="display:none"><h2>Entrar no painel</h2>
  <p>Digite o código de administrador de 6 dígitos (gerado na planilha: menu <b>GDV → Gerar código de administrador</b>).</p>
  <form id="formLogin"><input id="codigo" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="000 000" required><button class="primario" type="submit">Entrar</button></form>
  <div id="msgLogin" role="alert" style="margin-top:8px;color:var(--ruim)"></div></section>
<section id="filtros" aria-label="Filtros">
  <div class="grupo" id="presets" role="group" aria-label="Período">
    <button data-p="7">7 dias</button><button data-p="30">30 dias</button><button data-p="90">90 dias</button>
    <button data-p="mes">Mês atual</button><button data-p="ano">Ano</button>
  </div>
  <label>De<input type="date" id="fDe"></label>
  <label>Até<input type="date" id="fAte"></label>
  <label>Local<select id="fLocal"><option value="">Todos</option></select></label>
  <label>Posto<select id="fPosto"><option value="">Todos</option><option>Fixa</option><option>Móvel</option></select></label>
  <label>Fiscal<select id="fFiscal"><option value="">Todos</option></select></label>
  <button class="primario" id="btnAtualizar" type="button">Atualizar</button>
</section>
<div id="erro" role="alert"></div>
<main id="conteudo" aria-live="polite"><p class="vazio">Carregando…</p></main>
<div id="tip" role="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
const TIPOS = { PA: 'Passeio', UT: 'Utilitário', CC: 'Caminhão/Carreta', CB: 'Caminhão/Carreta Baú', ON: 'Ônibus', MT: 'Moto' };
const DIAS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const $ = s => document.querySelector(s);
const cor = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim();
const fmt = (n, d = 0) => (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dia = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const somaDias = (s, n) => { const d = dia(s); d.setDate(d.getDate() + n); return iso(d); };
const entreDias = (a, b) => Math.round((dia(b) - dia(a)) / 86400000);
const dBR = s => s.split('-').reverse().join('/');
const min = hm => { const m = /^(\d{1,2}):(\d{2})/.exec(hm || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const horasTxt = h => { const t = Math.round(h * 60); return `${Math.floor(t / 60)} h ${pad(t % 60)} min`; };
function h(tag, props, ...filhos) {                      // DOM seguro: texto sempre via textContent
  const el = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => { if (k === 'class') el.className = v; else if (k.startsWith('on')) el[k] = v; else el.setAttribute(k, v); });
  filhos.flat().forEach(f => { if (f != null) el.append(f.nodeType ? f : document.createTextNode(String(f))); });
  return el;
}

const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
let TOKEN = lsGet('gdv.painelToken'), ADM = lsGet('gdv.painelNome');
let RAW = { turnos: [], veiculos: [], geradoEm: 0 }, POR_TURNO = {}, F = {}, GRAF = {}, MAPA = null, CAMADA = null, TELA = { granul: 'auto', metrica: 'veiculos', paginas: 25 };

/* ---------- cálculo ---------- */
function duracao(t) {                                    // horas de barreira (só turnos encerrados)
  if (!t.e) return null;
  const a = min(t.ini), b = min(t.fim);
  if (a == null || b == null) return null;
  return ((b - a + 1440) % 1440 || 1440) / 60;
}
const veic = t => POR_TURNO[t.id] || [];
const pess = t => veic(t).reduce((s, v) => s + (Number(v.n) || 0), 0);
function selecionar(de, ate) {
  return RAW.turnos.filter(t => t.d >= de && t.d <= ate && (!F.local || t.lo === F.local) && (!F.posto || t.po === F.posto) && (!F.fiscal || t.f === F.fiscal));
}
function resumo(ts) {
  const r = { turnos: ts.length, enc: 0, andamento: 0, horas: 0, veic: 0, pessoas: 0, veicEnc: 0 };
  ts.forEach(t => {
    const n = veic(t).length; r.veic += n; r.pessoas += pess(t);
    const d = duracao(t);
    if (d == null) { if (!t.e) r.andamento++; } else { r.enc++; r.horas += d; r.veicEnc += n; }
  });
  r.vph = r.horas ? r.veicEnc / r.horas : 0; r.pph = r.horas ? ts.filter(t => duracao(t) != null).reduce((s, t) => s + pess(t), 0) / r.horas : 0;
  r.mediaTurno = r.enc ? r.veicEnc / r.enc : 0;
  return r;
}
function horaDoDia(t, v) { return Math.floor(min(v.h) / 60); }
function dataReal(t, v) { return min(v.h) < (min(t.ini) ?? 0) ? somaDias(t.d, 1) : t.d; }   // passou da meia-noite

/* ---------- interface: filtros e carga ---------- */
function preencherFiltros() {
  const unicos = k => [...new Set(RAW.turnos.map(t => t[k]).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const refaz = (id, valores) => { const s = $(id), at = s.value; s.querySelectorAll('option:not(:first-child)').forEach(o => o.remove()); valores.forEach(v => s.append(h('option', { value: v }, v))); s.value = valores.includes(at) ? at : ''; };
  refaz('#fLocal', unicos('lo')); refaz('#fFiscal', unicos('f'));
}
function definirPeriodo(p) {
  const hoje = iso(new Date());
  F.ate = hoje;
  if (p === 'mes') F.de = hoje.slice(0, 8) + '01'; else if (p === 'ano') F.de = hoje.slice(0, 5) + '01-01'; else F.de = somaDias(hoje, -(Number(p) - 1));
  $('#fDe').value = F.de; $('#fAte').value = F.ate;
}
function marcarPreset(p) { document.querySelectorAll('#presets button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === String(p)))); }
function mostrarLogin(msg) {
  $('#login').style.display = 'block'; $('#filtros').style.display = 'none'; $('#conteudo').style.display = 'none'; $('#sair').hidden = true; $('#quem').textContent = ''; $('#atualizado').textContent = '';
  $('#msgLogin').textContent = msg || ''; mostrarErro('');
}
function mostrarPainel() {
  $('#login').style.display = 'none'; $('#filtros').style.display = 'flex'; $('#conteudo').style.display = 'block'; $('#sair').hidden = false; $('#quem').textContent = ADM ? 'Administrador: ' + ADM + ' ·' : '';
}
function sair() { TOKEN = ''; ADM = ''; lsDel('gdv.painelToken'); lsDel('gdv.painelNome'); RAW = { turnos: [], veiculos: [], geradoEm: 0 }; mostrarLogin(''); }
function carregar() {
  if (!TOKEN) { mostrarLogin(''); return; }
  const de = $('#fDe').value, ate = $('#fAte').value;
  if (!de || !ate || de > ate) { mostrarErro('Período inválido.'); return; }
  F.de = de; F.ate = ate;
  const span = entreDias(de, ate) + 1, desde = somaDias(de, -span);       // também busca o período anterior (comparação)
  $('#conteudo').classList.add('carregando'); mostrarErro('');
  google.script.run.withSuccessHandler(r => { RAW = r; POR_TURNO = {}; r.veiculos.forEach(v => (POR_TURNO[v.t] = POR_TURNO[v.t] || []).push(v)); preencherFiltros(); desenhar(); $('#conteudo').classList.remove('carregando'); })
    .withFailureHandler(e => {
      $('#conteudo').classList.remove('carregando');
      const msg = e && e.message ? e.message : String(e);
      if (/sess[aã]o|inv[aá]lid|revogad/i.test(msg)) { TOKEN = ''; lsDel('gdv.painelToken'); mostrarLogin(msg.replace(/^Error:\s*/, '')); } else mostrarErro(msg);
    })
    .painelDados(TOKEN, { de: desde, ate });
}
function mostrarErro(m) { const e = $('#erro'); e.textContent = m; e.style.display = m ? 'block' : 'none'; }

/* ---------- peças reutilizáveis ---------- */
function tabela(colunas, linhas) {
  const t = h('table', null, h('thead', null, h('tr', null, colunas.map(c => h('th', { class: c.n ? 'n' : '' }, c.t)))));
  const tb = h('tbody'); linhas.forEach(l => tb.append(h('tr', null, l.map((c, i) => h('td', { class: colunas[i].n ? 'n' : '' }, c))))); t.append(tb); return t;
}
function cartao(id, titulo, sub, { controles, twin, grafico } = {}) {
  let btn = null;
  const c = h('section', { class: 'card', id });
  if (twin) btn = h('button', { type: 'button', onclick: () => { c.classList.toggle('verTabela'); btn.textContent = c.classList.contains('verTabela') ? 'Gráfico' : 'Tabela'; } }, 'Tabela');
  c.append(h('div', { class: 'cab' }, h('div', null, h('h2', null, titulo), sub ? h('div', { class: 'sub' }, sub) : null), h('div', { class: 'seg' }, controles || [], btn)));
  if (grafico) c.append(grafico);
  if (twin) c.append(h('div', { class: 'twin' }, twin));
  return c;
}
function tile(l, v, d, extra) { return h('div', { class: 'card tile ' + (extra || '') }, h('div', { class: 'l' }, l), h('div', { class: 'v' }, v), d || null); }
function delta(atual, antes) {                           // variação neutra: mais ou menos veículos não é "bom" nem "ruim" por si
  if (!antes) return h('div', { class: 'd' }, atual ? 'sem período anterior' : '—');
  const p = (atual - antes) / antes * 100;
  return h('div', { class: 'd' }, Math.abs(p) < 0.5 ? '= igual ao período anterior' : `${p >= 0 ? '▲' : '▼'} ${fmt(Math.abs(p), 0)}% vs. período anterior`);
}
const tip = $('#tip');
function mostrarTip(ev, titulo, linhas) {
  tip.replaceChildren(h('strong', null, titulo), ...linhas.map(l => h('div', null, l))); tip.style.display = 'block';
  const x = Math.min(ev.clientX + 14, innerWidth - 270), y = ev.clientY + 14; tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const esconderTip = () => { tip.style.display = 'none'; };
function novoGrafico(id, cfg) { if (GRAF[id]) GRAF[id].destroy(); GRAF[id] = new Chart($('#c_' + id), cfg); }
function opcoesBase(extra) {
  const ink2 = cor('ink2'), grade = cor('grade');
  return Object.assign({
    responsive: true, maintainAspectRatio: false, animation: false,
    plugins: {
      legend: { display: false },
      tooltip: { backgroundColor: cor('surface'), titleColor: cor('ink2'), bodyColor: cor('ink'), borderColor: cor('borda'), borderWidth: 1, padding: 9, boxWidth: 10, boxHeight: 3, usePointStyle: false, bodyFont: { weight: '600' } }
    },
    scales: {
      x: { grid: { display: false }, border: { color: cor('eixo') }, ticks: { color: cor('muted'), maxRotation: 0, autoSkip: true } },
      y: { beginAtZero: true, grid: { color: grade, drawTicks: false }, border: { display: false }, ticks: { color: cor('muted'), padding: 6, callback: v => v >= 1000 ? fmt(v / 1000, 1) + ' mil' : v } }
    }
  }, extra);
}
const linhaGuia = { id: 'guia', afterDatasetsDraw(c) {                // crosshair: acompanha o ponteiro e encaixa no X mais próximo
  const a = c.tooltip && c.tooltip.getActiveElements(); if (!a || !a.length) return;
  const { ctx, chartArea: ca } = c; ctx.save(); ctx.strokeStyle = cor('eixo'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a[0].element.x, ca.top); ctx.lineTo(a[0].element.x, ca.bottom); ctx.stroke(); ctx.restore();
} };
const valorNaPonta = { id: 'ponta', afterDatasetsDraw(c) {              // valor no fim da barra horizontal (só quando cabe)
  const { ctx, chartArea: ca } = c; ctx.save(); ctx.fillStyle = cor('ink2'); ctx.font = '12px system-ui'; ctx.textBaseline = 'middle';
  c.getDatasetMeta(0).data.forEach((b, i) => { const v = c.data.datasets[0].data[i], t = fmt(v), w = ctx.measureText(t).width; const x = b.x + 6; if (x + w < c.width) ctx.fillText(t, x, b.y); });
  ctx.restore();
} };

/* ---------- desenho do painel ---------- */
function desenhar() {
  Object.keys(GRAF).forEach(k => { GRAF[k].destroy(); delete GRAF[k]; });
  const root = $('#conteudo'); root.replaceChildren();
  const span = entreDias(F.de, F.ate) + 1, antDe = somaDias(F.de, -span), antAte = somaDias(F.de, -1);
  const ts = selecionar(F.de, F.ate), ant = selecionar(antDe, antAte), R = resumo(ts), A = resumo(ant);
  $('#atualizado').textContent = `Dados de ${new Date(RAW.geradoEm).toLocaleString('pt-BR')} · ${fmt(ts.length)} turnos no período`;
  if (!ts.length) { root.append(h('p', { class: 'vazio' }, 'Nenhum turno encontrado para os filtros escolhidos.')); return; }

  // indicadores
  const pico = (() => { const a = Array(24).fill(0); ts.forEach(t => veic(t).forEach(v => a[horaDoDia(t, v)]++)); const m = Math.max(...a); return m ? `${pad(a.indexOf(m))}h–${pad((a.indexOf(m) + 1) % 24)}h` : '—'; })();
  root.append(h('div', { class: 'grade' },
    tile('Veículos abordados', fmt(R.veic), delta(R.veic, A.veic), 'hero'),
    tile('Pessoas impactadas', fmt(R.pessoas), delta(R.pessoas, A.pessoas)),
    tile('Horas de barreira', horasTxt(R.horas), delta(R.horas, A.horas)),
    tile('Turnos', fmt(R.turnos), h('div', { class: 'd' }, `${fmt(R.enc)} encerrados · ${fmt(R.andamento)} em andamento`)),
    tile('Veículos por hora de barreira', fmt(R.vph, 1), delta(R.vph, A.vph)),
    tile('Pessoas por hora de barreira', fmt(R.pph, 1), delta(R.pph, A.pph)),
    tile('Média de veículos por turno', fmt(R.mediaTurno, 1), delta(R.mediaTurno, A.mediaTurno)),
    tile('Horário de maior fluxo', pico, h('div', { class: 'd' }, 'soma de todo o período'))));

  const linha1 = h('div', { class: 'cards' }); root.append(linha1);
  linha1.append(blocoEvolucao(ts), blocoHora(ts));
  const linha2 = h('div', { class: 'cards' }); root.append(linha2);
  linha2.append(blocoCalor(ts), blocoTurno(ts));
  const linha3 = h('div', { class: 'cards' }); root.append(linha3);
  linha3.append(blocoTipos(ts), blocoMapa(ts));
  const linha4 = h('div', { class: 'cards' }); root.append(linha4);
  linha4.append(blocoLocais(ts), blocoFiscais(ts));
  const linha5 = h('div', { class: 'cards' }); root.append(linha5);
  linha5.append(blocoAlertas(ts), blocoPlacas(ts));
  root.append(blocoTurnos(ts));
  desenharMapa(ts);
}

/* 1) evolução no período */
function blocoEvolucao(ts) {
  const span = entreDias(F.de, F.ate) + 1, gran = TELA.granul === 'auto' ? (span <= 45 ? 'dia' : span <= 200 ? 'semana' : 'mes') : TELA.granul;
  const chave = d => gran === 'dia' ? d : gran === 'mes' ? d.slice(0, 7) : somaDias(d, -((dia(d).getDay() + 6) % 7));
  const buckets = new Map();
  if (gran === 'dia') for (let d = F.de; d <= F.ate; d = somaDias(d, 1)) buckets.set(d, 0);
  const val = t => TELA.metrica === 'pessoas' ? pess(t) : TELA.metrica === 'horas' ? (duracao(t) || 0) : veic(t).length;
  ts.forEach(t => buckets.set(chave(t.d), (buckets.get(chave(t.d)) || 0) + val(t)));
  const ks = [...buckets.keys()].sort(), vs = ks.map(k => +buckets.get(k).toFixed(2));
  const rot = k => gran === 'mes' ? k.slice(5) + '/' + k.slice(2, 4) : gran === 'semana' ? 'sem. ' + dBR(k).slice(0, 5) : dBR(k).slice(0, 5);
  const nome = { veiculos: 'Veículos', pessoas: 'Pessoas', horas: 'Horas de barreira' }[TELA.metrica], un = TELA.metrica === 'horas' ? ' h' : '';
  const seg = (opcoes, atual, set) => opcoes.map(([v, t]) => h('button', { type: 'button', class: v === atual ? 'on' : '', onclick: () => { set(v); desenhar(); } }, t));
  const c = cartao('evolucao', `${nome} por ${gran === 'mes' ? 'mês' : gran}`, 'Total de cada ' + (gran === 'mes' ? 'mês' : gran) + ', pelo dia de início do turno', {
    controles: [h('span', { class: 'seg' }, seg([['veiculos', 'Veículos'], ['pessoas', 'Pessoas'], ['horas', 'Horas']], TELA.metrica, v => TELA.metrica = v)),
                h('span', { class: 'seg' }, seg([['auto', 'Auto'], ['dia', 'Dia'], ['semana', 'Semana'], ['mes', 'Mês']], TELA.granul, v => TELA.granul = v))],
    twin: tabela([{ t: 'Período' }, { t: nome + un, n: 1 }], ks.map((k, i) => [rot(k), fmt(vs[i], TELA.metrica === 'horas' ? 1 : 0)])),
    grafico: h('div', { class: 'graf' }, h('canvas', { id: 'c_evolucao', role: 'img', 'aria-label': nome + ' por período' }))
  });
  queueMicrotask(() => novoGrafico('evolucao', { type: 'bar', data: { labels: ks.map(rot), datasets: [{ data: vs, backgroundColor: cor('s1'), hoverBackgroundColor: cor('s1-hover'), maxBarThickness: 24, borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: 'bottom', categoryPercentage: 0.8, barPercentage: 0.9 }] },
    options: opcoesBase({ plugins: { legend: { display: false }, tooltip: { ...opcoesBase().plugins.tooltip, callbacks: { title: i => rot(ks[i[0].dataIndex]), label: i => `${fmt(i.parsed.y, TELA.metrica === 'horas' ? 1 : 0)}${un} · ${nome}` } } } }) }));
  return c;
}

/* 2) fluxo por hora do dia */
function blocoHora(ts) {
  const a = Array(24).fill(0); ts.forEach(t => veic(t).forEach(v => a[horaDoDia(t, v)]++));
  const total = a.reduce((s, x) => s + x, 0), rot = i => `${pad(i)}h`;
  const c = cartao('hora', 'Fluxo por hora do dia', 'Veículos abordados em cada hora, somando o período', {
    twin: tabela([{ t: 'Hora' }, { t: 'Veículos', n: 1 }, { t: '% do total', n: 1 }], a.map((v, i) => [rot(i), fmt(v), total ? fmt(v / total * 100, 1) + '%' : '—'])),
    grafico: h('div', { class: 'graf' }, h('canvas', { id: 'c_hora', role: 'img', 'aria-label': 'Veículos por hora do dia' }))
  });
  queueMicrotask(() => novoGrafico('hora', { type: 'bar', data: { labels: a.map((_, i) => rot(i)), datasets: [{ data: a, backgroundColor: cor('s1'), hoverBackgroundColor: cor('s1-hover'), maxBarThickness: 24, borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: 'bottom', categoryPercentage: 0.8 }] },
    options: opcoesBase({ plugins: { legend: { display: false }, tooltip: { ...opcoesBase().plugins.tooltip, callbacks: { title: i => `${rot(i[0].dataIndex)} – ${rot((i[0].dataIndex + 1) % 24)}`, label: i => `${fmt(i.parsed.y)} veículos (${total ? fmt(i.parsed.y / total * 100, 1) : 0}% do total)` } } } }) }));
  return c;
}

/* 3) mapa de calor: dia da semana × hora (sequencial, um só tom) */
function blocoCalor(ts) {
  const m = Array.from({ length: 7 }, () => Array(24).fill(0));
  ts.forEach(t => veic(t).forEach(v => { m[(dia(dataReal(t, v)).getDay() + 6) % 7][horaDoDia(t, v)]++; }));
  const max = Math.max(1, ...m.flat());
  const corCel = x => `color-mix(in srgb, var(--seq5) ${Math.round(x * 100)}%, var(--seq1))`;
  const g = h('div', { class: 'heat' }, h('div'), Array.from({ length: 24 }, (_, i) => h('div', null, i % 3 === 0 ? pad(i) : '')));
  m.forEach((lin, d) => { g.append(h('div', null, DIAS[d])); lin.forEach((v, hr) => {
    const cel = h('div', { class: 'c', tabindex: '0', 'aria-label': `${DIAS[d]} ${pad(hr)}h: ${v} veículos` });
    cel.style.background = v ? corCel(v / max) : cor('vazio');
    const abre = ev => mostrarTip(ev.type === 'focus' ? { clientX: cel.getBoundingClientRect().x, clientY: cel.getBoundingClientRect().y } : ev, `${DIAS[d]} · ${pad(hr)}h–${pad((hr + 1) % 24)}h`, [`${fmt(v)} veículos`]);
    cel.onpointermove = abre; cel.onfocus = abre; cel.onpointerleave = esconderTip; cel.onblur = esconderTip; g.append(cel); }); });
  const c = cartao('calor', 'Quando o fluxo é maior', 'Veículos por dia da semana e hora (cor mais intensa = mais veículos)', {
    twin: tabela([{ t: 'Dia' }, ...Array.from({ length: 24 }, (_, i) => ({ t: pad(i), n: 1 }))], m.map((lin, d) => [DIAS[d], ...lin.map(x => fmt(x))])),
    grafico: h('div', { class: 'rolar', style: 'max-height:none' }, g, h('div', { class: 'escala' }, '0', h('span', { class: 'rampa' }), fmt(max)))
  });
  return c;
}

/* 4) fluxo ao longo do turno: média de veículos em cada hora decorrida desde o início */
function blocoTurno(ts) {
  const series = {};
  ['A', 'B'].forEach(L => {
    const turnos = ts.filter(t => t.l === L && duracao(t) != null);
    if (!turnos.length) return;
    const maxH = Math.min(12, Math.ceil(Math.max(...turnos.map(duracao))));
    const soma = Array(maxH).fill(0), den = Array(maxH).fill(0);
    turnos.forEach(t => { const d = duracao(t), ini = min(t.ini); for (let i = 0; i < maxH; i++) if (d > i) den[i]++; veic(t).forEach(v => { const k = Math.floor(((min(v.h) - ini + 1440) % 1440) / 60); if (k < maxH) soma[k]++; }); });
    series[L] = { turnos: turnos.length, dados: soma.map((s, i) => den[i] ? +(s / den[i]).toFixed(2) : null) };
  });
  const letras = Object.keys(series), nomes = { A: 'Turno A (início 04h–11h59)', B: 'Turno B (demais inícios)' }, cores = { A: 's1', B: 's2' };
  const n = Math.max(0, ...letras.map(L => series[L].dados.length));
  const c = cartao('turno', 'Fluxo ao longo do turno', 'Média de veículos por turno em cada hora decorrida desde o início', {
    twin: tabela([{ t: 'Hora do turno' }, ...letras.map(L => ({ t: 'Turno ' + L, n: 1 }))], Array.from({ length: n }, (_, i) => [`${i + 1}ª hora`, ...letras.map(L => series[L].dados[i] == null ? '—' : fmt(series[L].dados[i], 1))])),
    grafico: h('div', null,
      letras.length > 1 || letras.length === 1 ? h('div', { class: 'legenda' }, letras.map(L => h('span', null, h('i', { style: `background:var(--${cores[L]})` }), `${nomes[L]} · ${series[L].turnos} turnos`))) : null,
      h('div', { class: 'graf' }, h('canvas', { id: 'c_turno', role: 'img', 'aria-label': 'Fluxo ao longo do turno' })))
  });
  if (!letras.length) { c.querySelector('.graf').replaceWith(h('p', { class: 'vazio' }, 'Sem turnos encerrados no período.')); return c; }
  queueMicrotask(() => novoGrafico('turno', { type: 'line', data: { labels: Array.from({ length: n }, (_, i) => `${i + 1}ª h`), datasets: letras.map(L => ({ label: nomes[L], data: series[L].dados, borderColor: cor(cores[L]), backgroundColor: cor(cores[L]), borderWidth: 2, tension: 0.25, pointRadius: 4, pointHoverRadius: 6, pointBorderColor: cor('surface'), pointBorderWidth: 2, spanGaps: true })) },
    options: opcoesBase({ interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: false }, tooltip: { ...opcoesBase().plugins.tooltip, callbacks: { label: i => `${fmt(i.parsed.y, 1)} veíc./turno · ${i.dataset.label.split(' (')[0]}` } } } }), plugins: [linhaGuia] }));
  return c;
}

/* 5) tipos de veículo (um tom só: categorias nominais) */
function blocoTipos(ts) {
  const cont = {}, pes = {}; ts.forEach(t => veic(t).forEach(v => { cont[v.k] = (cont[v.k] || 0) + 1; pes[v.k] = (pes[v.k] || 0) + (Number(v.n) || 0); }));
  const ks = Object.keys(cont).sort((a, b) => cont[b] - cont[a]), total = ks.reduce((s, k) => s + cont[k], 0);
  const c = cartao('tipos', 'Veículos por tipo', 'Todos os veículos abordados no período', {
    twin: tabela([{ t: 'Tipo' }, { t: 'Veículos', n: 1 }, { t: '%', n: 1 }, { t: 'Pessoas', n: 1 }], ks.map(k => [TIPOS[k] || k, fmt(cont[k]), fmt(cont[k] / total * 100, 1) + '%', fmt(pes[k])])),
    grafico: h('div', { class: 'graf' }, h('canvas', { id: 'c_tipos', role: 'img', 'aria-label': 'Veículos por tipo' }))
  });
  queueMicrotask(() => novoGrafico('tipos', { type: 'bar', data: { labels: ks.map(k => TIPOS[k] || k), datasets: [{ data: ks.map(k => cont[k]), backgroundColor: cor('s1'), hoverBackgroundColor: cor('s1-hover'), maxBarThickness: 24, borderRadius: { topRight: 4, bottomRight: 4 }, borderSkipped: 'left' }] },
    options: opcoesBase({ indexAxis: 'y', layout: { padding: { right: 44 } }, scales: { x: { beginAtZero: true, grid: { color: cor('grade') }, border: { display: false }, ticks: { color: cor('muted') } }, y: { grid: { display: false }, border: { color: cor('eixo') }, ticks: { color: cor('ink2') } } },
      plugins: { legend: { display: false }, tooltip: { ...opcoesBase().plugins.tooltip, callbacks: { label: i => [`${fmt(i.parsed.x)} veículos (${fmt(i.parsed.x / total * 100, 1)}%)`, `${fmt(pes[ks[i.dataIndex]])} pessoas`] } } } }), plugins: [valorNaPonta] }));
  return c;
}

/* 6) mapa das barreiras */
function blocoMapa() { return cartao('cartaoMapa', 'Onde as barreiras ocorreram', 'Ponto registrado no encerramento do turno (ou no início, se faltar)', { grafico: h('div', { id: 'mapa' }) }); }
function desenharMapa(ts) {
  const alvo = $('#mapa'); if (!alvo) return;
  if (typeof L === 'undefined') { alvo.replaceWith(h('p', { class: 'vazio' }, 'O mapa precisa de internet para carregar.')); return; }
  MAPA = L.map(alvo, { scrollWheelZoom: false }); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(MAPA);
  const pts = []; ts.forEach(t => { const la = t.la2 ?? t.la1, ln = t.ln2 ?? t.ln1; if (la == null || ln == null) return; pts.push([la, ln]);
    const dados = h('div', null, h('b', null, t.tf), h('div', null, `${dBR(t.d)} · ${t.lo}`), h('div', null, `${veic(t).length} veículos · ${pess(t)} pessoas`), h('a', { href: `https://www.google.com/maps?q=${la},${ln}`, target: '_blank', rel: 'noopener' }, 'Abrir no Google Maps'));
    L.circleMarker([la, ln], { radius: 8, color: cor('surface'), weight: 2, fillColor: cor('s1'), fillOpacity: 0.9 }).bindPopup(dados).addTo(MAPA); });
  if (pts.length) MAPA.fitBounds(pts, { padding: [24, 24], maxZoom: 15 }); else { MAPA.setView([-3.1, -60.0], 5); L.popup().setLatLng([-3.1, -60.0]).setContent('Nenhum turno com coordenadas no período.').openOn(MAPA); }
}

/* 7) tabelas por local e por fiscal */
function agrupar(ts, chaveFn) {
  const g = new Map(); ts.forEach(t => { const k = chaveFn(t); const r = g.get(k) || { turnos: 0, horas: 0, veic: 0, veicEnc: 0, pessoas: 0 }; const d = duracao(t), n = veic(t).length; r.turnos++; r.veic += n; r.pessoas += pess(t); if (d != null) { r.horas += d; r.veicEnc += n; } g.set(k, r); });
  return [...g.entries()].sort((a, b) => b[1].veic - a[1].veic);
}
function blocoLocais(ts) {
  const g = agrupar(ts, t => `${t.lo}|${t.po || ''}`);
  return cartao('locais', 'Por local de barreira', 'Ordenado por veículos abordados', { grafico: h('div', { class: 'rolar' }, tabela([{ t: 'Local' }, { t: 'Posto' }, { t: 'Turnos', n: 1 }, { t: 'Horas', n: 1 }, { t: 'Veículos', n: 1 }, { t: 'Veíc./h', n: 1 }, { t: 'Pessoas', n: 1 }],
    g.map(([k, r]) => { const [lo, po] = k.split('|'); return [lo, po, fmt(r.turnos), horasTxt(r.horas), fmt(r.veic), r.horas ? fmt(r.veicEnc / r.horas, 1) : '—', fmt(r.pessoas)]; }))) });
}
function blocoFiscais(ts) {
  const g = agrupar(ts, t => t.u || t.f);
  return cartao('fiscais', 'Por fiscal (quem lançou)', 'Conta do aparelho que registrou o turno', { grafico: h('div', { class: 'rolar' }, tabela([{ t: 'Fiscal' }, { t: 'Turnos', n: 1 }, { t: 'Horas', n: 1 }, { t: 'Veículos', n: 1 }, { t: 'Pessoas', n: 1 }],
    g.map(([k, r]) => [k, fmt(r.turnos), horasTxt(r.horas), fmt(r.veic), fmt(r.pessoas)]))) });
}

/* 8) alertas de qualidade dos dados */
function blocoAlertas(ts) {
  const al = [], agora = Date.now();
  ts.forEach(t => {
    const dd = dia(t.d), m0 = min(t.ini) || 0, ini = new Date(dd.getFullYear(), dd.getMonth(), dd.getDate(), Math.floor(m0 / 60), m0 % 60).getTime();
    const d = duracao(t), n = veic(t).length;
    if (!t.e && agora - ini > 14 * 3600e3) al.push(['⚠️ Atenção', `${t.tf} está em andamento há ${Math.floor((agora - ini) / 3600e3)} h (talvez não tenha sido encerrado).`]);
    if (t.e && n === 0) al.push(['ℹ️ Aviso', `${t.tf} foi encerrado sem nenhum veículo registrado.`]);
    if (d != null && (d < 0.33 || d > 16)) al.push(['⚠️ Atenção', `${t.tf} tem duração incomum: ${horasTxt(d)}.`]);
  });
  const semGps = ts.filter(t => t.la1 == null && t.la2 == null).length;
  if (semGps) al.push(['ℹ️ Aviso', `${semGps} turno(s) sem coordenadas (GPS indisponível ou negado).`]);
  return cartao('alertas', 'Alertas', 'Itens que merecem conferência no período', { grafico: al.length ? h('div', null, al.slice(0, 12).map(([t, m]) => h('div', { class: 'alerta' }, h('b', null, t), h('span', null, m))), al.length > 12 ? h('div', { class: 'vazio' }, `…e mais ${al.length - 12}.`) : null) : h('div', { class: 'alerta' }, h('b', null, '✅ Tudo certo'), h('span', null, 'Nenhum alerta no período.')) });
}

/* 9) placas recorrentes */
function blocoPlacas(ts) {
  const m = new Map(); ts.forEach(t => veic(t).forEach(v => { const r = m.get(v.p) || { n: 0, tipo: v.k, ultimo: '' }; r.n++; if (t.d > r.ultimo) r.ultimo = t.d; m.set(v.p, r); }));
  const top = [...m.entries()].filter(([, r]) => r.n >= 2).sort((a, b) => b[1].n - a[1].n || b[1].ultimo.localeCompare(a[1].ultimo)).slice(0, 10);
  return cartao('placas', 'Placas recorrentes', 'Veículos abordados mais de uma vez no período', { grafico: top.length ? h('div', { class: 'rolar' }, tabela([{ t: 'Placa' }, { t: 'Tipo' }, { t: 'Vezes', n: 1 }, { t: 'Última', n: 1 }], top.map(([p, r]) => [p, TIPOS[r.tipo] || r.tipo, fmt(r.n), dBR(r.ultimo)]))) : h('p', { class: 'vazio' }, 'Nenhuma placa repetida no período.') });
}

/* 10) lista de turnos + exportação */
function blocoTurnos(ts) {
  const ord = ts.slice().sort((a, b) => b.d.localeCompare(a.d) || (min(b.ini) || 0) - (min(a.ini) || 0)), n = TELA.paginas;
  const linhas = ord.slice(0, n).map(t => { const d = duracao(t), la = t.la2 ?? t.la1, ln = t.ln2 ?? t.ln1;
    return [t.tf, dBR(t.d), t.lo, t.f, `${t.ini}${t.fim ? '–' + t.fim : ''}`, d == null ? (t.e ? '—' : 'em andamento') : horasTxt(d), fmt(veic(t).length), fmt(pess(t)), la != null ? h('a', { href: `https://www.google.com/maps?q=${la},${ln}`, target: '_blank', rel: 'noopener' }, 'mapa') : '—']; });
  const csv = (nome, cab, rows) => { const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; const a = h('a', { href: URL.createObjectURL(new Blob(['﻿' + [cab, ...rows].map(r => r.map(q).join(';')).join('\n')], { type: 'text/csv;charset=utf-8' })), download: nome }); a.click(); };
  const c = cartao('turnos', 'Turnos do período', `${fmt(ts.length)} turnos · mais recentes primeiro`, { grafico: h('div', null,
    h('div', { class: 'rolar' }, tabela([{ t: 'TF' }, { t: 'Data' }, { t: 'Local' }, { t: 'Fiscal(is)' }, { t: 'Horário' }, { t: 'Duração', n: 1 }, { t: 'Veículos', n: 1 }, { t: 'Pessoas', n: 1 }, { t: 'Ponto' }], linhas)),
    h('div', { class: 'btn-dl' },
      ord.length > n ? h('button', { type: 'button', onclick: () => { TELA.paginas += 50; desenhar(); } }, 'Mostrar mais') : null,
      h('button', { type: 'button', onclick: () => csv(`turnos_${F.de}_${F.ate}.csv`, ['TF', 'Data', 'Local', 'Posto', 'Unidade', 'Fiscal(is)', 'Início', 'Fim', 'Horas', 'Veículos', 'Pessoas', 'Lat início', 'Lng início', 'Lat fim', 'Lng fim'], ord.map(t => [t.tf, dBR(t.d), t.lo, t.po, t.un, t.f, t.ini, t.fim, duracao(t) == null ? '' : duracao(t).toFixed(2).replace('.', ','), veic(t).length, pess(t), t.la1, t.ln1, t.la2, t.ln2])) }, 'Baixar CSV – turnos'),
      h('button', { type: 'button', onclick: () => csv(`veiculos_${F.de}_${F.ate}.csv`, ['TF', 'Data', 'Hora', 'Placa', 'Tipo', 'Pessoas', 'Local', 'Fiscal(is)'], ord.flatMap(t => veic(t).map(v => [t.tf, dBR(t.d), v.h, v.p, TIPOS[v.k] || v.k, v.n, t.lo, t.f]))) }, 'Baixar CSV – veículos'))) });
  c.style.gridColumn = '1 / -1'; return c;
}

/* ---------- inicialização ---------- */
document.querySelectorAll('#presets button').forEach(b => b.onclick = () => { definirPeriodo(b.dataset.p); marcarPreset(b.dataset.p); TELA.paginas = 25; carregar(); });
['#fLocal', '#fPosto', '#fFiscal'].forEach(id => $(id).onchange = () => { F.local = $('#fLocal').value; F.posto = $('#fPosto').value; F.fiscal = $('#fFiscal').value; TELA.paginas = 25; desenhar(); });
$('#fDe').onchange = $('#fAte').onchange = () => marcarPreset('');
$('#btnAtualizar').onclick = carregar;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (RAW.turnos.length) desenhar(); });
$('#sair').onclick = sair;
$('#formLogin').onsubmit = ev => {
  ev.preventDefault(); const btn = $('#formLogin button'); btn.disabled = true; btn.textContent = 'Entrando…'; $('#msgLogin').textContent = '';
  google.script.run.withSuccessHandler(r => { TOKEN = r.token; ADM = r.nome; lsSet('gdv.painelToken', TOKEN); lsSet('gdv.painelNome', ADM); btn.disabled = false; btn.textContent = 'Entrar'; $('#codigo').value = ''; mostrarPainel(); carregar(); })
    .withFailureHandler(e => { btn.disabled = false; btn.textContent = 'Entrar'; $('#msgLogin').textContent = (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ''); })
    .painelAtivar($('#codigo').value);
};
definirPeriodo('30'); marcarPreset('30');
if (TOKEN) { mostrarPainel(); carregar(); } else mostrarLogin('');
