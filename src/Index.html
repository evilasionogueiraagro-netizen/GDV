<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --bg:#f6f7f4; --card:#fff; --ink:#1f2a1f; --mut:#667066; --line:#dfe4dc; --brand:#2f6b3a; --brand2:#e9f1e6; --bad:#b3372f; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header small { opacity:.85; }
  nav { display:flex; gap:4px; padding:8px 16px 0; flex-wrap:wrap; border-bottom:1px solid var(--line); background:var(--card); }
  nav button { border:0; background:none; padding:10px 14px; cursor:pointer; font:inherit; color:var(--mut); border-bottom:3px solid transparent; }
  nav button.on { color:var(--brand); border-color:var(--brand); font-weight:600; }
  main { padding:16px; max-width:1100px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:14px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); }
  .kpi .v { font-size:24px; font-weight:700; } .kpi .l { color:var(--mut); font-size:12px; }
  .charts { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
  .charts canvas { max-height:260px; }
  h2 { font-size:15px; margin:0 0 10px; }
  table { border-collapse:collapse; width:100%; }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { background:var(--brand2); position:sticky; top:0; }
  .scroll { overflow:auto; max-height:480px; }
  button.btn { background:var(--brand); color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; font:inherit; }
  button.btn.sec { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  button.lnk { background:none; border:0; color:var(--brand); cursor:pointer; font:inherit; padding:0 6px; }
  button.lnk.del { color:var(--bad); }
  .bar { display:flex; gap:8px; align-items:end; flex-wrap:wrap; margin-bottom:12px; }
  label { display:flex; flex-direction:column; font-size:12px; color:var(--mut); gap:3px; }
  input,select,textarea { font:inherit; padding:7px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); min-width:140px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; padding:12px; }
  .modal.on { display:flex; }
  .modal form { background:#fff; border-radius:8px; padding:16px; width:100%; max-width:440px; max-height:92vh; overflow:auto; display:grid; gap:10px; }
  .modal input,.modal select,.modal textarea { width:100%; }
  #msg { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:9px 16px; border-radius:6px; display:none; max-width:90%; }
  #msg.err { background:var(--bad); }
  .empty { color:var(--mut); padding:14px; text-align:center; }
  @media print { header,nav,.bar,#msg { display:none !important; } body { background:#fff; } .card { border:0; } }
</style>
</head>
<body>
<header><h1>🐂 GDV – Gestão da Fazenda</h1><small id="user"></small></header>
<nav id="nav"></nav>
<main id="main"><div class="empty">Carregando…</div></main>

<div class="modal" id="modal"><form id="form"></form></div>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const COLORS = ['#2f6b3a','#c28a2c','#3a7ca5','#a8553a','#7a6bb0','#6b8f71','#888'];
let SCHEMA = {}, TAB = 'Dashboard', charts = [], LAST_REPORT = null;

const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => 'R$ ' + (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = (n,d=1) => (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const dBR = s => /^\d{4}-\d{2}-\d{2}$/.test(s) ? s.split('-').reverse().join('/') : esc(s);

function run(fn, ...args) {
  return new Promise((ok, no) => google.script.run
    .withSuccessHandler(ok)
    .withFailureHandler(e => { toast(e.message || String(e), true); no(e); })[fn](...args));
}
function toast(t, err) {
  const m = $('#msg'); m.textContent = t; m.className = err ? 'err' : ''; m.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = 'none', 4000);
}

async function init() {
  const r = await run('api_init');
  SCHEMA = r.schema; $('#user').textContent = r.user;
  const tabs = ['Dashboard', ...Object.keys(SCHEMA), 'Relatórios'];
  $('#nav').innerHTML = tabs.map(t => `<button data-t="${esc(t)}">${esc(SCHEMA[t] ? SCHEMA[t].label : t)}</button>`).join('');
  $('#nav').onclick = e => { if (e.target.dataset.t) go(e.target.dataset.t); };
  go('Dashboard');
}

function go(t) {
  TAB = t;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  charts.forEach(c => c.destroy()); charts = [];
  if (t === 'Dashboard') return dashboard();
  if (t === 'Relatórios') return reports();
  return list(t);
}

/* ---------- Dashboard ---------- */
async function dashboard() {
  $('#main').innerHTML = `
    <div class="bar">
      <label>De<input type="date" id="f_de"></label><label>Até<input type="date" id="f_ate"></label>
      <button class="btn" id="f_ok">Aplicar período</button>
    </div><div id="dash"><div class="empty">Carregando…</div></div>`;
  $('#f_ok').onclick = drawDash; drawDash();
}
async function drawDash() {
  const f = { de: $('#f_de').value, ate: $('#f_ate').value };
  const d = await run('api_dashboard', f);
  if (TAB !== 'Dashboard') return;
  charts.forEach(c => c.destroy()); charts = [];
  const k = d.kpis;
  const kp = (l, v) => `<div class="card kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  $('#dash').innerHTML = `
    <div class="grid">
      ${kp('Animais cadastrados', k.totalAnimais)}${kp('Animais ativos', k.ativos)}
      ${kp('Peso médio atual (kg)', num(k.pesoMedio))}${kp('GMD médio (kg/dia)', num(k.gmdMedio,3))}
      ${kp('Receitas', brl(k.receita))}${kp('Despesas', brl(k.despesa))}
      ${kp('Saldo', `<span style="color:${k.saldo<0?'var(--bad)':'var(--brand)'}">${brl(k.saldo)}</span>`)}
    </div>
    <div class="charts">
      <div class="card"><h2>Fluxo de caixa mensal</h2><canvas id="c1"></canvas></div>
      <div class="card"><h2>Animais por status</h2><canvas id="c2"></canvas></div>
      <div class="card"><h2>Animais ativos por lote</h2><canvas id="c3"></canvas></div>
      <div class="card"><h2>Despesas por categoria</h2><canvas id="c4"></canvas></div>
    </div>`;
  const mk = (id, cfg) => charts.push(new Chart($(id), cfg));
  const fl = d.fluxoMensal;
  mk('#c1', { type:'bar', data:{ labels: fl.map(x=>x.mes), datasets:[
    {label:'Receitas', data: fl.map(x=>x.receita), backgroundColor:COLORS[0]},
    {label:'Despesas', data: fl.map(x=>x.despesa), backgroundColor:COLORS[3]} ]}, options:{responsive:true} });
  const pie = (id, o) => mk(id, { type:'doughnut', data:{ labels:Object.keys(o),
    datasets:[{ data:Object.values(o), backgroundColor:COLORS }]}, options:{responsive:true} });
  pie('#c2', d.porStatus); pie('#c3', d.porLote); pie('#c4', d.despesaPorCategoria);
}

/* ---------- CRUD genérico ---------- */
async function list(entity) {
  const def = SCHEMA[entity];
  $('#main').innerHTML = `<div class="bar"><button class="btn" id="new">+ Novo registro</button>
    <label>Buscar<input id="q" placeholder="filtrar…"></label></div>
    <div class="card scroll" id="tbl"><div class="empty">Carregando…</div></div>`;
  const rows = await run('api_list', entity);
  if (TAB !== entity) return;
  const draw = () => {
    const q = $('#q').value.toLowerCase();
    const sh = rows.filter(r => !q || def.fields.some(f => String(r[f.key]).toLowerCase().includes(q)));
    $('#tbl').innerHTML = sh.length ? `<table><thead><tr>${def.fields.map(f=>`<th>${esc(f.label)}</th>`).join('')}<th></th></tr></thead><tbody>
      ${sh.map(r => `<tr>${def.fields.map(f => `<td>${cell(f, r[f.key])}</td>`).join('')}
      <td><button class="lnk" data-e="${esc(r.id)}">Editar</button><button class="lnk del" data-d="${esc(r.id)}">Excluir</button></td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">Nenhum registro.</div>';
  };
  draw();
  $('#q').oninput = draw;
  $('#new').onclick = () => form(entity, {});
  $('#tbl').onclick = async e => {
    const id = e.target.dataset.e || e.target.dataset.d; if (!id) return;
    const rec = rows.find(r => r.id === id);
    if (e.target.dataset.e) return form(entity, rec);
    if (!confirm('Excluir este registro?')) return;
    await run('api_delete', entity, id); toast('Excluído.'); list(entity);
  };
}
function cell(f, v) {
  if (v === '' || v == null) return '';
  if (f.type === 'date') return dBR(v);
  if (f.type === 'number') return f.label.includes('R$') ? brl(v) : num(v, 1);
  return esc(v);
}
async function form(entity, rec) {
  const def = SCHEMA[entity], fm = $('#form');
  const opts = {};
  for (const f of def.fields) if (f.ref) opts[f.key] = await run('api_refValues', f.ref);
  const inp = f => {
    const v = rec[f.key] ?? (f.type === 'date' && !rec.id ? new Date().toISOString().slice(0,10) : '');
    const req = f.required ? 'required' : '';
    if (f.type === 'select') {
      const o = f.options || opts[f.key] || [];
      return `<select name="${f.key}" ${req}><option value=""></option>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
    }
    if (f.type === 'textarea') return `<textarea name="${f.key}" rows="3">${esc(v)}</textarea>`;
    const t = f.type === 'number' ? 'number" step="any' : f.type;
    return `<input type="${t}" name="${f.key}" value="${esc(v)}" ${req}>`;
  };
  fm.innerHTML = `<h2>${rec.id ? 'Editar' : 'Novo'} – ${esc(def.label)}</h2>
    ${def.fields.map(f => `<label>${esc(f.label)}${f.required?' *':''}${inp(f)}</label>`).join('')}
    <div class="bar"><button class="btn" type="submit">Salvar</button><button class="btn sec" type="button" id="cancel">Cancelar</button></div>`;
  $('#modal').classList.add('on');
  $('#cancel').onclick = () => $('#modal').classList.remove('on');
  fm.onsubmit = async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(fm)); data.id = rec.id || '';
    const btn = fm.querySelector('[type=submit]'); btn.disabled = true;
    try { await run('api_save', entity, data); $('#modal').classList.remove('on'); toast('Salvo.'); list(entity); }
    catch (_) { btn.disabled = false; }
  };
}

/* ---------- Relatórios ---------- */
function reports() {
  $('#main').innerHTML = `<div class="bar">
    <label>Relatório<select id="r_t"><option value="animais">Animais</option><option value="gmd">Ganho médio diário (GMD)</option><option value="financeiro">Financeiro</option></select></label>
    <label>De<input type="date" id="r_de"></label><label>Até<input type="date" id="r_ate"></label>
    <label>Filtro<select id="r_x"></select></label>
    <button class="btn" id="r_go">Gerar</button>
    <button class="btn sec" id="r_csv">Baixar CSV</button><button class="btn sec" id="r_pr">Imprimir / PDF</button></div>
    <div class="card scroll" id="rep"><div class="empty">Escolha o relatório e clique em Gerar.</div></div>`;
  const fx = { animais:['','Ativo','Vendido','Morto','Descartado'], gmd:[''], financeiro:['','Receita','Despesa'] };
  const setX = () => $('#r_x').innerHTML = fx[$('#r_t').value].map(x => `<option value="${x}">${x||'(todos)'}</option>`).join('');
  setX(); $('#r_t').onchange = setX;
  $('#r_go').onclick = async () => {
    const t = $('#r_t').value, x = $('#r_x').value;
    const f = { de:$('#r_de').value, ate:$('#r_ate').value };
    if (t === 'animais') f.status = x; if (t === 'financeiro') f.tipo = x;
    const r = LAST_REPORT = await run('api_report', t, f);
    $('#rep').innerHTML = `<h2>${esc(r.titulo)}</h2><table><thead><tr>${r.colunas.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
      ${r.linhas.map(l=>`<tr>${l.map(c=>`<td>${dBR(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>
      <p><b>${esc(r.totais)}</b></p>`;
  };
  $('#r_pr').onclick = () => window.print();
  $('#r_csv').onclick = () => {
    if (!LAST_REPORT) return toast('Gere o relatório primeiro.', true);
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = '﻿' + [LAST_REPORT.colunas, ...LAST_REPORT.linhas].map(l => l.map(q).join(';')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = 'relatorio.csv'; a.click();
  };
}

init();
</script>
</body>
</html>
